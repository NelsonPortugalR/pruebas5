# Temporal: comprueba el sitio publicado en el Worker de Cloudflare
# (no guarda nada; solo imprime el resultado).
name: snapshot-web
on:
  push:
    branches: [snapshot-web]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sitio publicado (direcciones limpias, contenido nuevo, sin nombres)
        run: |
          set -u
          BASE="https://equipo-arequipa-web.nelson1614.workers.dev"
          echo "== direcciones limpias (sin seguir redirecciones)"
          for f in "" catalogo servicio oportunidad guias recetas ollas-arequipa calculadora-cuotas guias/que-es-rena-ware guias/garantia-rena-ware guias/ollas-rena-ware-antiguas guias/fallas-cocina-de-induccion-rena-ware guias/extractor-nutrex-press guias/opiniones-rena-ware guias/rena-ware-vs-tramontina-y-record recetas/huevo-frito-que-no-se-pega productos/juego-chef-i-7-piezas sitemap.xml robots.txt; do
            code=$(curl -sS -o /tmp/p -w '%{http_code}' "$BASE/$f" || echo 000)
            canon=$(grep -o 'rel="canonical" href="[^"]*"' /tmp/p | head -1 | sed "s#rel=\"canonical\" href=\"$BASE##; s#\"##")
            nombre=$(grep -ciE 'nelson[^1]|portugal' /tmp/p || true)
            echo "/$f -> $code | canonical: $canon | $(grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c8-70) | nombre personal: $nombre | noindex: $(grep -c 'noindex' /tmp/p || true)"
          done
          echo "== la dirección con .html"
          curl -sS -o /dev/null -w 'catalogo.html -> %{http_code} a %{redirect_url}\n' "$BASE/catalogo.html"
          curl -sS -o /dev/null -w 'guias/que-es-rena-ware.html -> %{http_code} a %{redirect_url}\n' "$BASE/guias/que-es-rena-ware.html"
          curl -sS -o /dev/null -w 'index.html -> %{http_code} a %{redirect_url}\n' "$BASE/index.html"
          curl -sS -o /dev/null -w 'no-existe -> %{http_code}\n' "$BASE/no-existe"
          echo "== sitemap"
          curl -sS "$BASE/sitemap.xml" -o /tmp/s.xml
          echo "urls: $(grep -c '<loc>' /tmp/s.xml) | con .html: $(grep -c '\.html</loc>' /tmp/s.xml || true) | calculadora: $(grep -c 'calculadora-cuotas' /tmp/s.xml) | guias: $(grep -c '/guias/' /tmp/s.xml) | borradores: $(grep -c 'royal\|tramontina' /tmp/s.xml || true)"
          echo "== inicio"
          curl -sS "$BASE/" -o /tmp/i.html
          echo "enlaces internos con .html: $(grep -o 'href="[a-z/][^":]*\.html' /tmp/i.html | wc -l) | tarjetas: $(grep -o 'class="post reveal"' /tmp/i.html | wc -l) | calculadora: $(grep -c 'href="/calculadora-cuotas"' /tmp/i.html)"
          curl -sS "$BASE/calculadora-cuotas" -o /tmp/c.html
          echo "calculadora: opciones $(grep -o '<option' /tmp/c.html | wc -l) | WebApplication $(grep -c 'WebApplication' /tmp/c.html) | FAQ $(grep -c 'FAQPage' /tmp/c.html)"
      - name: Dominios candidatos (sin nombres de personas ni la marca registrada)
        run: |
          set -u
          sudo apt-get install -y -qq whois >/dev/null 2>&1 || true
          echo "== .com y .net (RDAP de Verisign: 404 = libre, 200 = registrado)"
          for d in equipoarequipa ollasarequipa ollasenarequipa equipoaqp ollasaqp arequipaollas cocinasanaarequipa ollasdeaceroarequipa ollasdeaceroquirurgico equipoarequipaperu; do
            c=$(curl -sS -o /tmp/r.json -w '%{http_code}' "https://rdap.verisign.com/com/v1/domain/$d.com" || echo 000)
            extra=""; [ "$c" = "200" ] && extra=" | $(grep -o '"eventAction":"expiration","eventDate":"[^"]*"' /tmp/r.json | head -1 | cut -d'"' -f8) | $(grep -o '"fn",{},"text","[^"]*"' /tmp/r.json | head -1 | cut -d'"' -f8)"
            echo "$d.com -> $c$extra"
          done
          for d in equipoarequipa ollasarequipa; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' "https://rdap.verisign.com/net/v1/domain/$d.net" || echo 000); echo "$d.net -> $c"
          done
          echo "== .pe y .com.pe (whois de punto.pe)"
          for d in equipoarequipa.pe equipoarequipa.com.pe ollasarequipa.pe ollasarequipa.com.pe equipoaqp.pe ollasdeaceroquirurgico.pe; do
            echo "--- $d"; (whois -h kero.yachay.pe "$d" 2>&1 || true) | grep -v '^%' | grep -iE 'status|registrant|registrar|no object|not registered|name server|domain name|creat|expir' | head -8
          done
