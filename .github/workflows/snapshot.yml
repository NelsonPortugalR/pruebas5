# Temporal: comprueba desde fuera el sitio publicado (dominio propio y dirección antigua de Cloudflare).
# No guarda nada; solo imprime el resultado.
name: snapshot-web
on:
  push:
    branches: [snapshot-web]
  workflow_dispatch:
    inputs:
      conversion:
        description: "Probar también el clic de conversión con un navegador (envía un clic de prueba a Google Ads)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NUEVO: https://ollasarequipa.com
      VIEJO: https://equipo-arequipa-web.nelson1614.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Dominio (DNS, certificado y redirecciones)
        run: |
          set -u
          echo "== DNS"
          for h in ollasarequipa.com www.ollasarequipa.com; do
            echo "$h -> A: $(dig +short "$h" A | tr '\n' ' ')| AAAA: $(dig +short "$h" AAAA | tr '\n' ' ')"
          done
          echo "NS: $(dig +short ollasarequipa.com NS | tr '\n' ' ')"
          echo "TXT: $(dig +short ollasarequipa.com TXT | tr '\n' ' ')"
          echo "== redirecciones (sin seguirlas)"
          for u in "http://ollasarequipa.com/" "http://ollasarequipa.com/catalogo?x=1" "http://www.ollasarequipa.com/" "https://www.ollasarequipa.com/" "https://www.ollasarequipa.com/guias/que-es-rena-ware?x=1" "$NUEVO/catalogo.html" "$NUEVO/index.html" "$NUEVO/guias/que-es-rena-ware.html" "$NUEVO/no-existe" "$NUEVO/catalogo/"; do
            curl -sS -o /dev/null -m 25 -w "$u -> %{http_code} a [%{redirect_url}]\n" "$u" || echo "$u -> ERROR"
          done
          echo "== certificado"
          echo | openssl s_client -servername ollasarequipa.com -connect ollasarequipa.com:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "sin certificado"
          echo "== cabeceras del inicio"
          curl -sSI -m 25 "$NUEVO/" | grep -iE '^(HTTP|content-type|cache-control|x-robots-tag|server|strict-transport|location|content-encoding)' || true
          curl -sS -m 25 --compressed -o /dev/null -w 'inicio: %{size_download} bytes en %{time_total}s (http %{http_version})\n' "$NUEVO/"
      - name: Páginas en el dominio propio
        run: |
          set -u
          for f in "" catalogo servicio oportunidad guias recetas ollas-arequipa calculadora-cuotas guias/que-es-rena-ware guias/garantia-rena-ware guias/ollas-de-acero-quirurgico guias/consultar-cuota-y-deuda-rena-ware guias/opiniones-rena-ware guias/royal-prestige-vs-rena-ware guias/rena-ware-vs-tramontina-y-record recetas/huevo-frito-que-no-se-pega productos/juego-chef-i-7-piezas; do
            code=$(curl -sS -o /tmp/p -m 25 -w '%{http_code}' "$NUEVO/$f" || echo 000)
            canon=$(grep -o 'rel="canonical" href="[^"]*"' /tmp/p | head -1 | sed 's#rel="canonical" href="##; s#"##')
            echo "/$f -> $code | canonical: $canon | og:url: $(grep -o 'property="og:url" content="[^"]*"' /tmp/p | head -1 | sed 's#.*content="##; s#"##') | workers.dev: $(grep -c 'workers\.dev' /tmp/p || true) | nombre personal: $(grep -ciE 'nelson|portugal' /tmp/p || true) | noindex: $(grep -c 'noindex' /tmp/p || true) | $(grep -o '<title>[^<]*' /tmp/p | head -1 | cut -c8-60)"
          done
          echo "== datos estructurados del inicio (direcciones)"
          curl -sS -m 25 "$NUEVO/" | grep -o '"\(url\|@id\|image\|logo\)": *"[^"]*"' | sort | uniq -c | head -20
          echo "== verificación de Google"
          curl -sS -m 25 "$NUEVO/" | grep -o '<meta name="google-site-verification"[^>]*>' || echo "sin etiqueta"
          for g in googlecd63f0b146a53f34.html; do curl -sS -o /tmp/g -m 25 -w "$g -> %{http_code} " "$NUEVO/$g"; cat /tmp/g; echo; done
          echo "== robots.txt"
          curl -sS -m 25 "$NUEVO/robots.txt"
          echo "== sitemap"
          curl -sS -m 25 -D /tmp/h "$NUEVO/sitemap.xml" -o /tmp/s.xml
          grep -iE '^(HTTP|content-type|x-robots-tag)' /tmp/h || true
          echo "urls: $(grep -c '<loc>' /tmp/s.xml) | en ollasarequipa.com: $(grep -c '<loc>https://ollasarequipa.com' /tmp/s.xml || true) | en workers.dev: $(grep -c 'workers\.dev' /tmp/s.xml || true) | con .html: $(grep -c '\.html</loc>' /tmp/s.xml || true) | borradores: $(grep -c 'royal\|tramontina' /tmp/s.xml || true)"
          head -c 600 /tmp/s.xml; echo
          echo "== cada dirección del sitemap responde 200 sin redirigir"
          malas=0
          for u in $(grep -o '<loc>[^<]*' /tmp/s.xml | sed 's#<loc>##'); do
            code=$(curl -sS -o /dev/null -m 25 -w '%{http_code}' "$u" || echo 000)
            if [ "$code" != "200" ]; then echo "$u -> $code"; malas=$((malas+1)); fi
          done
          echo "direcciones del sitemap con problema: $malas"
      - name: Medición (script de origen y clics; etiqueta de Google solo si hay IDs)
        run: |
          set -u
          for f in "" catalogo servicio oportunidad ollas-arequipa calculadora-cuotas guias/que-es-rena-ware productos/juego-chef-i-7-piezas recetas/huevo-frito-que-no-se-pega; do
            curl -sS -m 25 "$NUEVO/$f?ref=google/marca&gclid=prueba" -o /tmp/p -w "/$f -> %{http_code} | "
            echo "oaClic: $(grep -c 'window.oaClic=' /tmp/p) | lee ref=: $(grep -c 'q.get("ref")' /tmp/p) | etiqueta de Google: $(grep -c 'googletagmanager.com/gtag/js?id=G-YV9NXJZHS2' /tmp/p) | Analytics y Ads configurados: $(grep -o 'gtag("config","[^"]*")' /tmp/p | wc -l) | nota de cookies: $(grep -c 'cookies de Google' /tmp/p) | IDs: $(grep -o 'var M={[^}]*}' /tmp/p | head -1)"
          done
      - name: Analytics y conversiones de Google Ads en vivo, con un navegador de verdad
        # Manda clics de prueba a Google (sin clic de anuncio no cuentan como conversión). Solo corre si el mensaje del
        # commit lleva [medicion] o si se pide a mano, para no hacerlo en cada revisión.
        if: contains(github.event.head_commit.message, '[medicion]') || (github.event_name == 'workflow_dispatch' && inputs.conversion)
        run: |
          set -u
          for i in $(seq 1 40); do
            curl -sS -m 25 "$NUEVO/" -o /tmp/p || true
            grep -q 'G-YV9NXJZHS2' /tmp/p && grep -q 'zesDCObAgLgdEMnByN4D' /tmp/p && break
            sleep 8
          done
          mkdir -p /tmp/nav && cd /tmp/nav
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1.63.0 >/dev/null 2>&1 || npm i playwright-core >/dev/null 2>&1
          cat > prueba.js <<'EOF'
          const { chromium } = require('playwright-core');
          const BASE = process.env.NUEVO, GA = 'G-YV9NXJZHS2', CUENTA = '1003626697', WA = 'HBHdCM_PvbcdEMnByN4D', TEL = 'zesDCObAgLgdEMnByN4D';
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true });
            const ctx = await browser.newContext({ viewport: { width: 390, height: 800 }, locale: 'es-PE' });
            const page = await ctx.newPage();
            const ga = [], ads = [], otros = [];
            page.on('request', r => {
              const u = r.url();
              if (/\/g\/collect/.test(u)) {
                const x = new URL(u);
                const cuerpo = r.postData() || '';
                const nombres = [x.searchParams.get('en')].concat(cuerpo.split('\n').map(l => (new URLSearchParams(l)).get('en'))).filter(Boolean);
                const extra = cuerpo.split('\n').concat([x.search]).map(l => { const q = new URLSearchParams(l); return [q.get('ep.boton'), q.get('ep.origen')].filter(Boolean).join('/'); }).filter(Boolean);
                ga.push({ host: x.host, tid: x.searchParams.get('tid'), eventos: nombres, extra });
              } else if (u.includes('/pagead/conversion/' + CUENTA)) {
                ads.push(new URL(u).searchParams.get('label'));
              }
            });
            page.on('response', r => { const u = r.url(); if (/googletagmanager\.com\/gtag\/js/.test(u)) otros.push(r.status() + ' ' + new URL(u).pathname + '?id=' + new URL(u).searchParams.get('id')); if (/\/g\/collect/.test(u) || u.includes('/pagead/conversion/' + CUENTA)) otros.push(r.status() + ' ' + new URL(u).host + new URL(u).pathname); });
            await ctx.route(/api\.whatsapp\.com|wa\.me|whatsapp:/, r => r.abort());
            await page.addInitScript(() => { window.open = () => null; });
            await page.goto(BASE + '/?ref=google/marca', { waitUntil: 'load' });
            await page.waitForTimeout(6000);
            const toca = (sel) => page.evaluate((sel) => { const a = document.querySelector(sel); if (!a) return false; document.addEventListener('click', e => e.preventDefault(), { once: true }); a.click(); return true; }, sel);
            console.log('botón de WhatsApp tocado:', await toca('[data-wa]'));
            await page.waitForTimeout(6000);
            console.log('enlace de teléfono tocado:', await toca('a[href^="tel:"]'));
            await page.waitForTimeout(7000);
            await page.goto(BASE + '/catalogo', { waitUntil: 'load' });   // al salir de la página Analytics termina de enviar lo pendiente
            await page.waitForTimeout(5000);
            const eventos = ga.flatMap(g => g.eventos);
            const ids = [...new Set(ga.map(g => g.tid))];
            console.log('Analytics, propiedad que recibe:', ids.join(', ') || 'NINGUNA');
            console.log('Analytics, eventos enviados:', eventos.join(', ') || 'NINGUNO');
            console.log('Analytics, botón y origen:', [...new Set(ga.flatMap(g => g.extra))].join(' | ') || 'sin datos');
            console.log('Ads, etiquetas de conversión enviadas:', ads.join(', ') || 'NINGUNA');
            console.log('respuestas de Google:', [...new Set(otros)].join(' ; '));
            console.log('cookies de Google:', (await ctx.cookies()).map(c => c.name).filter(n => /^_gcl|^_ga/.test(n)).join(', ') || 'ninguna');
            const lista = [
              ['Analytics recibe la visita (page_view) en ' + GA, ids.length === 1 && ids[0] === GA && eventos.includes('page_view')],
              ['Analytics recibe el clic a WhatsApp', eventos.includes('clic_whatsapp')],
              ['Analytics recibe el clic para llamar', eventos.includes('clic_llamada')],
              ['Ads recibe la conversión de WhatsApp', ads.includes(WA)],
              ['Ads recibe la conversión de llamada', ads.includes(TEL)],
              ['Cada conversión de Ads se envía una sola vez', ads.filter(x => x === WA).length === 1 && ads.filter(x => x === TEL).length === 1],
            ];
            for (const [n, c] of lista) console.log((c ? 'OK    ' : 'FALTA ') + n);
            await browser.close();
            if (!lista.every(x => x[1])) process.exit(1);
          })().catch(e => { console.log('ERROR', e.message); process.exit(1); });
          EOF
          node prueba.js
      - name: Garantía en las fichas y páginas de destino de los anuncios (en vivo)
        run: |
          set -u
          for f in productos/filtro-de-agua-aqua-nano-ctu-500 productos/cocina-de-induccion-ic-450 productos/olla-a-presion-8-l productos/nutrex-press-elite productos/juego-chef-i-7-piezas productos/juego-de-cuchillos-elite-16-piezas productos/rena-lite-pack-de-4; do
            curl -sS -m 25 "$NUEVO/$f" -o /tmp/p -w "/$f -> %{http_code} | "
            echo "nota: $(grep -o 'Entrega a domicilio en Arequipa · [^·]* ·' /tmp/p | head -1) | «de por vida»: $(grep -o 'de por vida' /tmp/p | wc -l)"
          done
          echo "== destinos de los anuncios, con el sufijo de campaña"
          for f in "" catalogo ollas-arequipa servicio oportunidad calculadora-cuotas productos/filtro-de-agua-aqua-nano-ctu-500 guias/garantia-rena-ware productos/juego-gourmet-17-piezas productos/sarten-grande-con-tapa-30-cm productos/cubiertos-elite-35-piezas productos/tetera-con-infusor-de-te productos/botella-filtrante productos/rena-wok-34-cm; do
            curl -sS -o /tmp/p -m 25 -w "/$f -> %{http_code} a [%{redirect_url}] | " "$NUEVO/$f?utm_source=google&utm_medium=cpc&utm_campaign=marca&utm_term=prueba"
            echo "oaClic: $(grep -c 'window.oaClic=' /tmp/p) | botones de WhatsApp: $(grep -o 'data-wa=\|wa.me/\|api.whatsapp.com' /tmp/p | wc -l) | noindex: $(grep -c 'noindex' /tmp/p)"
          done
          curl -sS -m 25 "$NUEVO/ollas-arequipa" | grep -o 'la olla a presión tiene su propia garantía' | head -1
      - name: Guía de pago, paso a paso en Yape y en la app del BCP (en vivo)
        run: |
          set -u
          G="$NUEVO/guias/consultar-cuota-y-deuda-rena-ware"
          for i in $(seq 1 30); do
            curl -sS -m 25 "$G" -o /tmp/g || true
            grep -q 'id="paso-a-paso-bcp"' /tmp/g && break
            sleep 8
          done
          echo "secciones: yape $(grep -c 'id="paso-a-paso-yape"' /tmp/g), bcp $(grep -c 'id="paso-a-paso-bcp"' /tmp/g) | pasos: $(grep -o '<li><div class="pc-txt">' /tmp/g | wc -l) | capturas con enlace para ampliar: $(grep -o '<figure><a href="/img/guias/[^"]*"' /tmp/g | wc -l) | columna En la app del BCP: $(grep -o "data-col='En la app del BCP'" /tmp/g | wc -l) | nombre personal: $(grep -ciE 'nelson|portugal' /tmp/g || true)"
          echo "preguntas del BCP: $(grep -o '¿Cómo pago mi cuota de Rena Ware en la app del BCP?\|¿Cómo hago un pago adicional a mi deuda con Rena Ware?' /tmp/g | sort -u | wc -l) | menciones de Otro Cobranza: $(grep -o 'Otro Cobranza' /tmp/g | wc -l) | índice: $(grep -o '<a href="#paso-a-paso-[a-z]*">[^<]*' /tmp/g | sed 's/.*>//' | tr '\n' ';')"
          for img in $(grep -o 'src="/img/guias/[^"]*"' /tmp/g | sed 's/src="//; s/"//' | sort -u); do
            curl -sS -m 25 -o /tmp/i -w "$img -> %{http_code} %{content_type} %{size_download} bytes | " "$NUEVO$img"
            echo "sha256 $(sha256sum /tmp/i | cut -c1-16)"
          done
      - name: Datos estructurados en vivo (videos, productos, eventos y recetas, según las reglas de Google)
        run: |
          set -u
          for i in $(seq 1 40); do
            curl -sS -m 25 "$NUEVO/productos/juego-chef-i-7-piezas" -o /tmp/p || true
            grep -q 'poster="/img/videos/' /tmp/p && break
            sleep 8
          done
          python3 herramientas/validar_sd.py --vivo "$NUEVO"
          echo "== ficha de producto: video y reproductor"
          grep -o '<video[^>]*>' /tmp/p | cut -c1-220
          grep -o '{"@context":"https://schema.org","@type":"VideoObject"[^<]*' /tmp/p | cut -c1-700
          echo "== inicio: sin eventos y con la lista simple"
          curl -sS -m 25 "$NUEVO/" -o /tmp/i
          echo "Event: $(grep -c '"@type":"Event"' /tmp/i) | Product: $(grep -o '"@type":"Product"' /tmp/i | wc -l) | ItemList: $(grep -o '"@type":"ItemList"' /tmp/i | wc -l) | la agenda sigue en la página: $(grep -c 'id="eventos"' /tmp/i)"
          for f in catalogo ollas-arequipa servicio; do
            curl -sS -m 25 "$NUEVO/$f" -o /tmp/c
            echo "/$f -> Product: $(grep -o '"@type":"Product"' /tmp/c | wc -l) | ListItem: $(grep -o '"@type":"ListItem"' /tmp/c | wc -l) | Service: $(grep -o '"@type":"Service"' /tmp/c | wc -l)"
          done
          echo "== receta"
          curl -sS -m 25 "$NUEVO/recetas/arroz-graneado" | grep -o '"keywords":"[^"]*"\|"datePublished":"[^"]*"\|"image":"[^"]*"'
      - name: Especiales que salen en la web y el interruptor «En la web» del panel del registro
        run: |
          set -u
          for i in $(seq 1 40); do
            curl -sS -m 25 "$NUEVO/" -o /tmp/i || true
            grep -q 'Mira el video: cómo llegar' /tmp/i || break
            sleep 8
          done
          curl -sS -m 25 "$NUEVO/catalogo" -o /tmp/c
          echo "catálogo -> listas de especiales nombradas: $(grep -o 'Especiales [A-ZÁÉÍÓÚa-záéíóúñ ]*' /tmp/c | sed 's/ *$//' | sort | uniq -c | tr '\n' ';')"
          echo "catálogo -> tarjetas de especiales: $(grep -o 'img/especiales/[0-9]*\.webp' /tmp/c | sort -u | wc -l) | menciones de «Compartir»: $(grep -o 'Compartir' /tmp/c | wc -l) | vence: $(grep -o 'Válidos hasta el [^<]*' /tmp/c | head -1)"
          echo "inicio -> $(grep -o '[0-9]* especiales con regalo · [^<]*' /tmp/i | head -1) | «Compartir»: $(grep -o 'Compartir' /tmp/i | wc -l) | botón de video falso: $(grep -c 'Mira el video: cómo llegar' /tmp/i) | mapa: $(grep -c 'maps.google.com/maps' /tmp/i)"
          for f in ollas-arequipa calculadora-cuotas productos/juego-gourmet-17-piezas; do
            curl -sS -m 25 "$NUEVO/$f" -o /tmp/x
            echo "/$f -> «Compartir»: $(grep -o 'Compartir' /tmp/x | wc -l) | «Navidad»: $(grep -o 'Navidad' /tmp/x | wc -l)"
          done
          for i in $(seq 1 30); do
            curl -sS -m 25 "$NUEVO/" -o /tmp/i || true
            grep -q 'trae a tus invitados' /tmp/i || break
            sleep 8
          done
          echo "agenda -> texto interno del horario: $(grep -c 'trae a tus invitados' /tmp/i) | texto público de la charla: $(grep -o 'Cómo funciona el negocio, ingresos y entrenamiento' /tmp/i | wc -l)"
          echo "== panel del registro (publicado)"
          curl -sSL -m 25 "https://renaware-registro.nelson1614.workers.dev/admin.html" -o /tmp/a -w "admin.html -> %{http_code} %{size_download} bytes en %{url_effective}\n"
          echo "interruptor «En la web»: $(grep -c 'data-f="web"' /tmp/a) | guarda web: $(grep -c "cuerpo.web = c.web" /tmp/a) | ayuda: $(grep -o 'siguiente actualización automática' /tmp/a | wc -l) | fecha de Lima: $(grep -c '5\*3600000' /tmp/a)"
      - name: Favicon e iconos en vivo, y la caja del regalo del catálogo con un navegador de verdad
        run: |
          set -u
          for i in $(seq 1 40); do
            curl -sS -m 25 "$NUEVO/" -o /tmp/p || true
            curl -sS -m 25 "$NUEVO/catalogo" -o /tmp/c || true
            grep -q 'href="/favicon-96x96.png"' /tmp/p && grep -q 'img/regalos/' /tmp/c && break
            sleep 8
          done
          echo "== etiquetas del favicon en las páginas"
          for f in "" catalogo servicio oportunidad guias/que-es-rena-ware productos/juego-chef-i-7-piezas recetas/huevo-frito-que-no-se-pega no-existe; do
            curl -sS -m 25 "$NUEVO/$f" -o /tmp/p -w "/$f -> %{http_code} | "
            echo "png96: $(grep -c 'rel="icon" type="image/png" href="/favicon-96x96.png"' /tmp/p) | svg: $(grep -c 'rel="icon" type="image/svg+xml" href="/favicon.svg"' /tmp/p) | ico: $(grep -c 'rel="shortcut icon" href="/favicon.ico"' /tmp/p) | apple: $(grep -c 'rel="apple-touch-icon"' /tmp/p) | manifiesto: $(grep -c 'rel="manifest" href="/site.webmanifest"' /tmp/p) | icono incrustado antiguo: $(grep -c 'rel="icon" href="data:' /tmp/p)"
          done
          echo "== archivos de iconos"
          mal=0
          for a in favicon.ico favicon.svg favicon-96x96.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png site.webmanifest img/regalos/tetera-con-infusor-navidad.webp; do
            code=$(curl -sS -m 25 -D /tmp/h -o /tmp/archivo -w '%{http_code}' "$NUEVO/$a" || echo 000)
            echo "/$a -> $code | $(grep -i '^content-type' /tmp/h | tr -d '\r') | $(grep -i '^cache-control' /tmp/h | tr -d '\r') | $(stat -c %s /tmp/archivo) bytes | $(file -b /tmp/archivo | cut -c1-120)"
            [ "$code" = "200" ] || mal=$((mal+1))
          done
          echo "archivos que no responden 200: $mal"
          echo "== manifiesto y logo del negocio"
          curl -sS -m 25 "$NUEVO/site.webmanifest" | python3 -c "import json,sys; m=json.load(sys.stdin); print('nombre:', m['name'], '| corto:', m['short_name'], '| display:', m['display'], '| iconos:', [(i['src'], i['sizes'], i.get('purpose', 'any')) for i in m['icons']])"
          curl -sS -m 25 "$NUEVO/" | grep -o '"logo": *"[^"]*"' | sort | uniq -c
          echo "== navegador"
          mkdir -p /tmp/nav2 && cd /tmp/nav2
          npm init -y >/dev/null 2>&1
          npm i playwright-core@1.63.0 >/dev/null 2>&1 || npm i playwright-core >/dev/null 2>&1
          cat > prueba.js <<'EOF'
          const { chromium } = require('playwright-core');
          const BASE = process.env.NUEVO;
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true });
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'es-PE' });
            // esta visita de prueba no debe contar en Analytics ni en Ads
            await ctx.route(/googletagmanager\.com|google-analytics\.com|doubleclick\.net|googleadservices\.com|google\.com\/(pagead|ccm)/, r => r.abort());
            const page = await ctx.newPage();
            const pedidas = [];
            page.on('request', r => { if (r.url().includes('/img/regalos/')) pedidas.push(r.url()); });
            await page.goto(BASE + '/catalogo', { waitUntil: 'load' });
            await page.waitForTimeout(2500);
            const iconos = await page.evaluate(async () => {
              const out = [];
              for (const l of document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]')) {
                // con «?prueba»: Playwright descarta por su cuenta las peticiones que terminan en /favicon.ico cuando intercepta la red
                out.push(await new Promise(ok => { const i = new Image(); const n = l.href.split('/').pop(); i.onload = () => ok(n + ' ' + i.naturalWidth + 'x' + i.naturalHeight); i.onerror = () => ok(n + ' NO ABRE'); i.src = l.href + '?prueba=1'; }));
              }
              return out;
            });
            console.log('iconos enlazados que el navegador abre:', iconos.join(' | '));
            const ocultaAlLlegar = await page.evaluate(() => document.getElementById('regalos-overlay').hidden);
            const pedidaAlCargar = pedidas.length > 0;
            console.log('quien llega de fuera -> cortina oculta:', ocultaAlLlegar, '| foto del regalo descargada sin abrirla:', pedidaAlCargar);
            await page.click('#regalos');
            await page.waitForSelector('#regalos-overlay:not([hidden])');
            await page.waitForTimeout(1500);
            await page.click('.caja');
            await page.waitForTimeout(1500);
            const c = await page.evaluate(() => {
              const caja = document.querySelector('.caja'), img = caja.querySelector('.dentro img'), r = caja.getBoundingClientRect();
              const e = img ? getComputedStyle(img) : null;
              return { cajas: document.querySelectorAll('.caja').length, abierta: caja.classList.contains('abierta'), ancho: Math.round(r.width), alto: Math.round(r.height),
                centrada: Math.abs((r.left + r.right) / 2 - innerWidth / 2) < 2, foto: img ? img.getAttribute('src') : null, natural: img ? img.naturalWidth + 'x' + img.naturalHeight : null,
                completa: img ? img.complete : false, ajuste: e ? e.objectFit : null, margen: e ? e.paddingTop : null, alt: img ? img.alt : null,
                nombre: document.querySelector('.regalo .nom').textContent, visibleNombre: getComputedStyle(document.querySelector('.regalo .nom')).opacity,
                titulo: document.getElementById('regalos-t').textContent, boton: document.getElementById('regalosBtn').textContent, sinFoto: !!caja.querySelector('.sin-foto') };
            });
            console.log('caja del regalo:', JSON.stringify(c));
            await page.click('#regalosBtn');
            await page.waitForTimeout(1000);
            const cerrada = await page.evaluate(() => document.getElementById('regalos-overlay').hidden);
            const lista = [
              ['Los iconos enlazados abren en el navegador', iconos.length >= 4 && !iconos.some(x => /NO ABRE/.test(x))],
              ['La foto del regalo no se descarga hasta abrir la cortina', ocultaAlLlegar && !pedidaAlCargar],
              ['La caja se abre y muestra la foto de la tetera', c.abierta && !c.sinFoto && c.completa && c.natural === '900x900' && /tetera-con-infusor-navidad\.webp$/.test(c.foto || '')],
              ['La foto ocupa toda la caja (sin margen) y la caja queda centrada', c.ajuste === 'cover' && c.margen === '0px' && c.centrada && c.ancho === c.alto && c.ancho >= 300],
              ['Debajo sale el nombre del regalo', /Tetera con infusor/.test(c.nombre) && c.visibleNombre === '1'],
              ['El botón lleva a las promociones y cierra la cortina', c.boton === 'Ver las promociones' && cerrada],
            ];
            for (const [n, ok] of lista) console.log((ok ? 'OK    ' : 'FALTA ') + n);
            await browser.close();
            if (!lista.every(x => x[1])) process.exit(1);
          })().catch(e => { console.log('ERROR', e.message); process.exit(1); });
          EOF
          node prueba.js
      - name: Dirección antigua (workers.dev)
        run: |
          set -u
          for f in "" catalogo guias/que-es-rena-ware; do
            code=$(curl -sS -o /tmp/p -m 25 -w '%{http_code}' "$VIEJO/$f" || echo 000)
            echo "/$f -> $code | canonical: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/p | head -1 | sed 's#rel="canonical" href="##; s#"##') | x-robots: $(curl -sSI -m 25 "$VIEJO/$f" | grep -i '^x-robots-tag' | tr -d '\r' || true)"
          done
          curl -sS -m 25 "$VIEJO/robots.txt" | grep -i sitemap || true
