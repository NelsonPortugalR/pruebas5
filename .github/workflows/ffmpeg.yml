# Temporal: comprueba si el runner trae ffmpeg y cuánto tarda en sacar un fotograma y la duración de un video del sitio.
name: prueba-ffmpeg
on:
  push:
    branches: [snapshot-web]
    paths: [".github/workflows/ffmpeg.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - name: ffmpeg del sistema
        run: |
          which ffmpeg ffprobe || echo "NO HAY ffmpeg en el runner"
          (ffmpeg -version 2>/dev/null | head -1) || true
      - name: ffmpeg por pip (imageio-ffmpeg)
        run: |
          time pip install --quiet imageio-ffmpeg
          python3 -c "import imageio_ffmpeg as i; print(i.get_ffmpeg_exe()); print(i.get_ffmpeg_version())"
      - name: Fotograma y duración de tres videos
        run: |
          set -u
          FF=$(which ffmpeg || python3 -c "import imageio_ffmpeg as i; print(i.get_ffmpeg_exe())")
          echo "usando $FF"
          for f in 000125-1784240751154 000159-1783479170555 000158-1783479150410; do
            U="https://kiexpdaaoegbtesqmaff.supabase.co/storage/v1/object/public/videos/$f.mp4"
            echo "== $f"
            curl -sI "$U" | grep -iE "^(HTTP|content-length|content-type|accept-ranges)" | tr -d '\r' | tr '\n' ' '; echo
            /usr/bin/time -f "info: %es" "$FF" -hide_banner -i "$U" 2>&1 | grep -E "Duration|Stream.*Video|info:" | head -4
            /usr/bin/time -f "fotograma: %es" "$FF" -hide_banner -v error -ss 4 -i "$U" -frames:v 1 -vf "scale='min(1280,iw)':-2" -q:v 4 -y /tmp/$f.jpg 2>&1 | tail -2
            ls -la /tmp/$f.jpg 2>/dev/null | awk '{print "archivo:", $5, "bytes"}'
          done
