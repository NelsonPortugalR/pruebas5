# Temporal: saca una hoja de fotogramas de los videos de producto que se repiten entre dos productos,
# para ver qué producto muestran. No cambia nada; deja las hojas como artefacto de la corrida.
name: fotogramas
on:
  push:
    branches: [fotogramas]
permissions:
  contents: write
jobs:
  hojas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hojas de fotogramas
        timeout-minutes: 6
        run: |
          set -eu
          pip install -q imageio-ffmpeg
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          base=https://kiexpdaaoegbtesqmaff.supabase.co/storage/v1/object/public/videos
          mkdir -p hojas
          for par in 000147-1783479424349:65.9 000118-1783479537828:81.1 000159-1783479170555:106.1; do
            v=${par%%:*}; dur=${par##*:}
            curl -sSfL --max-time 120 -o "$v.mp4" "$base/$v.mp4"
            fps=$(python3 -c "print(12/float('$dur'))")
            "$FF" -v error -i "$v.mp4" -vf "fps=$fps,scale=360:-2,tile=4x3:padding=6:margin=6" -frames:v 1 -q:v 4 "hojas/$v.jpg"
            echo "$v listo"
          done
          ls -la hojas
      - name: Guardar las hojas en esta rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add hojas && git commit -q -m "Hojas de fotogramas" && git push -q origin HEAD:fotogramas
